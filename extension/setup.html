<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuperX · Grok setup</title><link rel="icon" href="assets/icon-32.png"><link rel="stylesheet" href="setup.css">
</head>
<body>
  <main>
    <header><img src="assets/superx-logo.svg" alt="SuperX"><button id="settings" type="button" data-i18n="common.settings">Settings</button></header>
    <h1 data-i18n="options.buildSetup">Connect official Grok</h1><p class="muted" data-i18n="build.setupIntro"></p>
    <section><span class="step" aria-hidden="true">1</span><h2 data-i18n="options.buildStep1"></h2>
      <p><a href="https://github.com/xai-org/grok-build" target="_blank" rel="noopener noreferrer" data-i18n="options.officialBuild">Official Grok installation</a></p>
      <p class="muted" data-i18n="build.loginCommand">After installation, run:</p><code class="login-command" dir="ltr">grok login</code>
    </section>
    <section><span class="step" aria-hidden="true">2</span><h2 data-i18n="options.buildStep2"></h2>
      <label for="platform" data-i18n="build.platform">Your computer</label><select id="platform"><option value="windows">Windows</option><option value="macos">macOS</option></select>
      <div class="launch-actions"><button id="generate" type="button" data-i18n="build.generate">Generate launch command</button></div>
      <details class="connection-details"><summary data-i18n="build.details">Connection details (optional)</summary><div class="connection-fields"><div><label for="port" data-i18n="build.port">Local port</label><input id="port" type="number" min="1024" max="65535" step="1" value="2419"><p id="address" dir="ltr" class="muted"></p></div><div><label for="secret" data-i18n="build.code">Local connection code</label><input id="secret" type="password" maxlength="256" autocomplete="off" spellcheck="false" dir="ltr"><p class="muted" data-i18n="build.codeHelp"></p></div></div></details>
      <div id="launch" hidden><div class="command"><code id="command" dir="ltr" tabindex="0"></code><button id="copy" type="button" data-i18n="common.copy">Copy</button></div><p class="muted" data-i18n="build.commandPrivate"></p></div>
      <p class="muted" data-i18n="build.commandHelp"></p>
    </section>
    <section><span class="step" aria-hidden="true">3</span><h2 data-i18n="options.buildStep3"></h2>
      <button id="check" type="button" data-i18n="options.checkBuild">Check connection</button>
      <p id="status" role="status" aria-live="polite" class="muted"></p>
      <div id="model-choices" hidden><label for="model" data-i18n="options.model">Model</label><select id="model" required></select><label for="reasoning" data-i18n="options.reasoning">Reasoning effort</label><select id="reasoning" required></select><p class="muted" data-i18n="build.chooseModel"></p></div>
      <div class="actions"><button id="save" type="button" class="primary" data-i18n="build.saveConnection">Save connection</button></div><p class="muted" data-i18n="build.setupCheckHelp"></p>
    </section>
    <footer><p data-i18n="build.localPrivacy"></p><p class="muted" data-i18n="options.usageRules"></p><a href="https://grok.com/dashboard/usage" target="_blank" rel="noopener noreferrer" data-i18n="options.dashboardUsage"></a></footer>
  </main><script src="feed-core.js"></script><script src="ui-i18n.js"></script><script src="setup.js"></script>
</body></html>
