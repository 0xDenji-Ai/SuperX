name: Prepare preview release draft

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate release source
        run: node tools/validate.mjs
      - name: Require tag to match package and extension version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(process.env.RELEASE_TAG)) throw new Error("Use a vMAJOR.MINOR.PATCH release tag")'
          node tools/package-release.mjs --expected-version "${RELEASE_TAG#v}"
      - name: Prepare installation and support notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" --jq '.body' > "$RUNNER_TEMP/superx-generated-notes.md"
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const { GH_REPO: repo, RELEASE_TAG: tag, RUNNER_TEMP: directory } = process.env;
          const version = tag.slice(1);
          const project = `https://github.com/${repo}`;
          const download = `${project}/releases/download/${tag}`;
          const generated = await readFile(join(directory, 'superx-generated-notes.md'), 'utf8');
          const versionNotes = version === '0.9.11' ? [
            '## What changed since Stable 0.7.26',
            '',
            '- **Go deeper with Fact Check only.** Run one streamed fact check instead of an explanation followed by a second check. Investigate explicit claims, implied factual premises and relevant details without repeating the original post. Keep tool commands and intermediate output out of the final answer; mark missing final answers as incomplete.',
            '- **Sign in with The X Subscription directly in the browser.** New installations default to this route; Grok API Key and official local Grok Build / CLI / ACP remain independent options. Browser sign-in needs no Key, terminal or extra SuperX program. The official authorization page may show Grok Build because this flow uses the shared public client, not a separately registered SuperX identity.',
            '- **Choose model and reasoning separately.** All three connections start at Grok 4.3 / None and offer the same curated 4.3 / 4.5 / 4.6 / 4.7 menu, subject to account availability. Preserve saved settings, show unavailable choices explicitly and never silently change source, model, account budget or service tier.',
            '- **Wait for reading.** Automatic work starts after scrolling stops and a post remains visible for 1 second; Settings supports 0-30 seconds, including fractions. Default shared API concurrency is 3, configurable from 1 to 8. Started work retains its slot through local cancellation cleanup; local CLI work runs serially.',
            '- **Keep started work when browsing.** Preserve fact checks, comments and retry progress when scrolling away, when X temporarily unmounts a post, or when switching browser tabs. Returning reuses the same task. New automatic work pauses while the feed is hidden. Actual navigation, tab closure and BFCache suspension safely interrupt work, retain available partial output and require manual retry.',
            '- **Let X dialogs and media take precedence.** Temporarily hide the entire SuperX interaction layer for compose/reply dialogs, enlarged media and fullscreen content. Restore it after closing, and use consistent blue answer/source links in both themes.',
            '- **Keep failures local to the task.** API Key and local CLI transient failures wait 3 seconds and retry up to 5 additional times without freezing other posts; partial findings and reported usage accumulate. OAuth does not replay generation after an accepted HTTP 200 response, stream failure, incomplete output or timeout. An initial HTTP 401 rejection may refresh once and make one recovery request. Retries can use additional allowance or incur charges.',
            '- **Simplify Settings and troubleshooting.** Improve connection guidance, local model/search validation, disabled-state saving, compact preset/custom prompt controls and collapsible maintenance. Align Settings and history layout, keep history navigation last and localize extension metadata across the twelve interface languages.',
            '- **Retain the reading tools.** Stream Markdown with clickable sources and Token/model details, offer three copy-only comment drafts, retain independent answer/interface languages and keep searchable on-device 24-hour history available without a Grok login or Key. History text is stored locally without encryption; credentials are handled separately.',
            '- **Minimize and isolate credentials.** New sign-ins request only openid, offline_access, grok-cli:access and api:access; no profile/email scopes or profile lookup. Remembered refresh tokens are encrypted locally, access tokens remain session-only, and credentials stay out of the feed page. Existing connected grants remain valid without claiming retroactive scope reduction. Upgrading may require approval of the additional auth.x.ai site access.',
            '',
            '## Acceptance and current limits',
            '',
            '- Installed Windows Chrome has passed fresh user-approved four-scope authorization, login restoration after extension reload, a new Grok 4.3 Fact Check (30,226 tokens; six linked sources) and exactly three new comments (1,373 tokens). The copy button reported Copied; independent clipboard readback was not verified. The user confirmed that switching tabs during generation preserved the same running answer without restarting it.',
            '- Four-scope full-browser restart restoration and natural token expiry still require separate recorded acceptance. Earlier six-scope checks exercised copying, cache reuse and generation after fully restarting Chrome; those are historical results, not proof of four-scope restart restoration. macOS installed-browser operation, installed Edge acceptance and new real-account API Key / official CLI installation and inference are not established by the isolated or automated checks.',
            '- Automated regressions and isolated browser previews cover provider/lifecycle behavior, Windows/macOS command generation and localized layouts; they do not certify every account, subscription entitlement, Included billing treatment or upstream availability. Rendered citations were observed, but this is not a captured live native-annotation protocol assertion.',
            '- Subscription eligibility, available models/tools, allowance and charges follow the provider account. There is no automatic fallback, free/unlimited-use promise or spending cap. The Chrome Web Store and GitHub Stable remain 0.7.26; 0.9.11 stays a Preview pending store publication and matching-version acceptance.',
            '',
            '## Community credit',
            '',
            'Thank you to [@0xDenji-Ai](https://github.com/0xDenji-Ai) for [PR #1](https://github.com/bwjoke/SuperX/pull/1), proposing local Grok CLI access, dwell-based triggers, macOS setup guidance, media/dialog handling and preserving started work across tab switches, with attention to API compatibility. This release addresses those core goals through a separate implementation rather than merging the PR as-is. SuperX remains focused on automatic in-context fact-checking; the proposed click-only mode is not included.',
            '',
          ] : [];
          const notes = [
            `SuperX ${version} is a preview candidate for early feedback.`,
            '',
            `**[Download the installable ZIP](${download}/SuperX.zip)** · [Source ZIP](${download}/SuperX-${version}-source.zip)`,
            '',
            '1. Extract the installation ZIP into a permanent folder.',
            '2. Open Chrome or Edge Extensions, enable Developer mode, and load that folder as an unpacked extension.',
            '3. Open SuperX settings. New installations default to Sign in · The X Subscription: approve the short code yourself on the official xAI authorization page and return to SuperX. Grok API Key and Grok Build · Local CLI / ACP are optional alternatives, with Windows/macOS guidance. Existing connection choices are preserved. Save settings, enable SuperX and open X. Account eligibility, models, allowance and charges follow provider rules.',
            '',
            'Preview installations update manually: replace the files in the same folder, reload the extension, then refresh X. Installing a separate Chrome Web Store copy does not automatically migrate an unpacked copy\'s settings or Key.',
            '',
            `Installation files: [versioned ZIP](${download}/SuperX-${version}.zip), [SHA256 checksums](${download}/SuperX-${version}-SHA256SUMS.txt), [file inventory](${download}/SuperX-${version}-files.json). SuperX.zip contains the identical ZIP bytes.`,
            `Source files: [SHA256 checksums](${download}/SuperX-${version}-source-SHA256SUMS.txt), [file inventory](${download}/SuperX-${version}-source-files.json).`,
            `Optional local mode: [Windows / macOS setup guide](${project}/blob/${tag}/docs/CONNECTIONS.md). Install Grok from the official provider, sign in and follow the built-in guide; no separate SuperX program or Node installation is required.`,
            '',
            `**Support:** [Report a bug or suggest a feature](${project}/issues/new/choose) · [Installation guide](${project}/blob/${tag}/README.md) · [中文说明](${project}/blob/${tag}/README.zh-CN.md)`,
            '',
            `The Chrome Web Store is the stable distribution channel. After candidate acceptance, the same installation ZIP and SHA256 are submitted to the store; promotion changes release status and notes, never the tag or ZIP. See [release channels](${project}/blob/${tag}/docs/RELEASE_CHANNELS.md).`,
            '',
            ...versionNotes,
            `Detailed changes: [Changelog](${project}/blob/${tag}/CHANGELOG.md) · [Acceptance checklist](${project}/blob/${tag}/docs/RELEASE_CHECKLIST.md) · [Connection and acceptance details](${project}/blob/${tag}/docs/CONNECTIONS.md#acceptance-scope).`,
            '',
            '---',
            '',
            generated.trim(),
            '',
          ].join('\n');
          await writeFile(join(directory, 'superx-release-notes.md'), notes);
          NODE
      - name: Create or update a draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          assets=("artifacts/SuperX-$version.zip" "artifacts/SuperX.zip" "artifacts/SuperX-$version-files.json" "artifacts/SuperX-$version-SHA256SUMS.txt" "artifacts/SuperX-$version-source.zip" "artifacts/SuperX-$version-source-files.json" "artifacts/SuperX-$version-source-SHA256SUMS.txt")
          # Existing published releases are immutable for this workflow.
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/superx-release-state" 2>/dev/null; then
            if [ "$(cat "$RUNNER_TEMP/superx-release-state")" != "true" ]; then
              echo "Refusing to change a published release."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --draft --prerelease --latest=false \
              --title "SuperX $RELEASE_TAG (Preview)" --notes-file "$RUNNER_TEMP/superx-release-notes.md"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --draft --prerelease --latest=false \
              --title "SuperX $RELEASE_TAG (Preview)" --notes-file "$RUNNER_TEMP/superx-release-notes.md"
          fi
